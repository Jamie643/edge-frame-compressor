[project]
name = "edge-frame-compressor"
version = "0.1.0"
description = "Privacy-preserving frame extraction for AI vision pipelines."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "jamie643", email = "Jamesliberty330@users.noreply.github.com" }]
dependencies = [
    "opencv-python>=4.9,<5.0",
    "numpy>=1.24,<3.0",
    "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_frame_compressor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
